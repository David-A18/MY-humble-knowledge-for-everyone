# Educational workflow. Copy to .github/workflows/ and review paths before enabling.
name: CDK example contracts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.25.0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'
      - name: TypeScript assertions and synthesis
        working-directory: knowledge/cloud/aws/cdk/examples/typescript
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm test
          pnpm synth
      - name: Python assertions and synthesis
        working-directory: knowledge/cloud/aws/cdk/examples/python
        run: |
          python -m pip install -r requirements.txt
          python test_stack.py
          python app.py
      - name: Compare resource contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('knowledge/cloud/aws/cdk/examples')
          ts = json.loads((root/'typescript/cdk.out/KbDocsLab.template.json').read_text())
          py = json.loads((root/'python/cdk.out/KbDocsLab.template.json').read_text())
          assert ts['Resources'] == py['Resources']
          print('Equivalent infrastructure contracts')
          PY
