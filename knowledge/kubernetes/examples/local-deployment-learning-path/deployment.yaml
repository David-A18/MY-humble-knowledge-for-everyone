apiVersion: apps/v1
kind: Deployment
metadata:
  name: kb-web
  namespace: kb-learning
  labels:
    app.kubernetes.io/name: kb-web
    app.kubernetes.io/part-of: kb-local-learning
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kb-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kb-web
        app.kubernetes.io/part-of: kb-local-learning
    spec:
      containers:
        - name: web
          image: nginx:1.30.6-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
