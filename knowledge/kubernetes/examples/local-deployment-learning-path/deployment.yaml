apiVersion: apps/v1
kind: Deployment
metadata:
  name: kb-web
  namespace: kb-learning
  labels:
    app.kubernetes.io/name: kb-web
    app.kubernetes.io/part-of: kb-local-learning
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kb-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kb-web
        app.kubernetes.io/part-of: kb-local-learning
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
