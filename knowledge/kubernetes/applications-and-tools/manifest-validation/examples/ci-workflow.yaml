# Educational workflow. Copy to .github/workflows/ and review paths before enabling.
name: Manifest routing example
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: knowledge/kubernetes/applications-and-tools/manifest-validation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'
      - name: Offline structural contracts
        run: |
          python -m pip install PyYAML==6.0.3
          python examples/test-fixtures.py
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          version: v0.30.0
          node_image: kindest/node:v1.34.0
          cluster_name: manifest-ci
      - name: Positive and negative request test
        run: |
          kubectl create namespace manifest-lab
          kubectl apply -n manifest-lab -f examples/app.yaml -f examples/service.json
          kubectl rollout status deployment/web -n manifest-lab --timeout=120s
          kubectl run client -n manifest-lab --image=curlimages/curl:8.12.1 --restart=Never --command -- sh -c 'sleep 600'
          kubectl wait pod/client -n manifest-lab --for=condition=Ready --timeout=120s
          kubectl exec -n manifest-lab client -- curl --fail --connect-timeout 5 --max-time 10 http://web
          kubectl apply -n manifest-lab -f examples/service-broken.json
          result=0
          for attempt in $(seq 1 10); do
            set +e
            kubectl exec -n manifest-lab client -- curl --fail --connect-timeout 5 --max-time 10 http://web
            result=$?
            set -e
            if [ "$result" -eq 7 ] || [ "$result" -eq 28 ]; then break; fi
            if [ "$result" -ne 0 ]; then break; fi
            sleep 1
          done
          if [ "$result" -ne 7 ] && [ "$result" -ne 28 ]; then
            echo "Expected a connection failure or timeout, got $result" >&2
            exit 1
          fi
          kubectl apply -n manifest-lab -f examples/service.json
          kubectl exec -n manifest-lab client -- curl --fail --retry 10 --retry-connrefused --retry-delay 1 --connect-timeout 5 --max-time 10 http://web
      - name: Cleanup disposable namespace
        if: always()
        run: kubectl delete namespace manifest-lab --ignore-not-found
