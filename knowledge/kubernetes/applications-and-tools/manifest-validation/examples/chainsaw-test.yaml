apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: service-routing
spec:
  steps:
    - name: deploy-and-probe
      try:
        - apply:
            file: app.yaml
        - apply:
            file: service.json
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: web
              status:
                availableReplicas: 1
        - command:
            entrypoint: kubectl
            args:
              - --namespace
              - ($namespace)
              - exec
              - deployment/web
              - --
              - wget
              - -T
              - "5"
              - -q
              - -O
              - "-"
              - http://web
