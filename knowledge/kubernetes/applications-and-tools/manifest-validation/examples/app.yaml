apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    team: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.30.6-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
