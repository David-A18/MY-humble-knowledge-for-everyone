name: Documentation error
description: Report inaccurate, outdated, unclear, or broken documentation.
title: "docs: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: "Thanks for helping keep the knowledge base accurate."
  - type: input
    id: page
    attributes:
      label: Page
      description: Relative path or section where the issue appears.
      placeholder: "cloud/aws/networking/security-groups.md"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is incorrect, unclear, outdated, or broken?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment or version
      description: Tool, product, operating system, or environment version when relevant.
      placeholder: "Terraform v1.13.1, Kubernetes v1.34, Amazon EKS, Ubuntu"
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected correction
      description: What should the page say or link to instead?
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: Actual result or blocker
      description: What happened when you followed the documentation?
    validations:
      required: false
