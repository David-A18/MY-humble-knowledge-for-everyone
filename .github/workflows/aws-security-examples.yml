name: AWS security example validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  policy-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.13"

      - name: Check synthetic policy scope
        run: python knowledge/cloud/aws/security/examples/policy-contract-lab/check-contracts.py

      - name: Catch policy fixture regressions
        run: python knowledge/cloud/aws/security/examples/policy-contract-lab/test-contracts.py

      - name: Verify human-access inventory reconciliation
        run: python knowledge/cloud/aws/governance-and-access/examples/access-review-lab/test-reconcile.py

      - name: Report synthetic assignment and review findings
        run: python knowledge/cloud/aws/governance-and-access/examples/access-review-lab/reconcile.py
