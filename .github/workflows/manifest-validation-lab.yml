name: Manifest validation lab

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  manifest-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install pinned tools with release checksums
        shell: bash
        run: |
          set -euo pipefail
          tools_dir=$(mktemp -d)
          python examples/kubernetes/applications-and-tools/manifest-validation/install-tools.py --directory "$tools_dir"
          echo "$tools_dir" >> "$GITHUB_PATH"
          python -m pip install PyYAML==6.0.3

      - name: Check source fixtures
        run: python examples/kubernetes/applications-and-tools/manifest-validation/test-fixtures.py

      - name: Exercise actual semantic schema and policy tools
        run: python examples/kubernetes/applications-and-tools/manifest-validation/validate-offline.py --report manifest-offline-report.json

      - name: Exercise live drift routing regression and cleanup
        run: python examples/kubernetes/applications-and-tools/manifest-validation/validate-cluster.py --report manifest-cluster-report.json
