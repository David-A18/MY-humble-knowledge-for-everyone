name: FinOps example validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  finops-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Verify synthetic cost reconciliation and comparison contracts
        run: python examples/finops/cost-analysis-lab/test-cost-analysis.py

      - name: Run the synthetic report
        run: python examples/finops/cost-analysis-lab/cost-analysis.py
