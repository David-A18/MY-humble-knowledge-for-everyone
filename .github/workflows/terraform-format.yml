name: Terraform format

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  terraform-format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: |
          if ! find examples -name '*.tf' -type f | grep -q .; then
            echo "No Terraform files found in examples/; skipping terraform fmt."
            exit 0
          fi
          terraform fmt -recursive -check examples

      - name: Exercise local module, refactor, and workspace contracts
        run: python3 examples/terraform/module-workspace-lab/validate-lab.py --terraform terraform

      - name: Exercise local provider alias and dependency lock
        run: python3 examples/terraform/provider-alias-lab/validate-lab.py --terraform terraform
