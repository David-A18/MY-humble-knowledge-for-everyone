name: Link check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          output: lychee/out.md
          args: --config lychee.toml --root-dir "${{ github.workspace }}" --verbose --no-progress "**/*.md"

      - name: Fail on link check errors
        if: steps.lychee.outputs.exit_code != '0'
        run: |
          echo "Lychee failed with exit code ${{ steps.lychee.outputs.exit_code }}."
          if [ -f lychee/out.md ]; then
            cat lychee/out.md
            while IFS= read -r line; do
              escaped="${line//'%'/'%25'}"
              escaped="${escaped//$'\r'/'%0D'}"
              escaped="${escaped//$'\n'/'%0A'}"
              echo "::error file=.github/workflows/link-check.yml,title=Lychee link check::$escaped"
            done < lychee/out.md
          fi
          exit "${{ steps.lychee.outputs.exit_code }}"
