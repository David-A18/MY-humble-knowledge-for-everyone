exclude_path = [
  "sources/incoming",
  "sources/processed",
]

exclude = [
  "^https?://(www\\.)?example\\.com(/.*)?$",
  "^https?://github\\.com/example(/.*)?$",
  "^https?://localhost(:[0-9]+)?(/.*)?$",
  "^http://localhost(:[0-9]+)?(/.*)?$",
  "^https?://127\\.0\\.0\\.1(:[0-9]+)?(/.*)?$",
  "^http://127\\.0\\.0\\.1(:[0-9]+)?(/.*)?$",
  "^https://github\\.com/David-A18/MY-humble-knowledge-for-everyone/actions/runs/[0-9]+.*$",
  # Crossplane docs are valid official references, but GitHub-hosted lychee
  # runners intermittently fail to connect to this Netlify-backed domain.
  "^https://docs\\.crossplane\\.io(/.*)?$",
]

# Check public sources without overwhelming a single host. Transient 503s
# still fail after retries; permanent broken links remain failures.
max_concurrency = 16
max_retries = 4
retry_wait_time = 2
