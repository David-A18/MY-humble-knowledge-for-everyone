exclude_path = [
  "sources/incoming",
  "sources/processed",
]

exclude = [
  "^https?://(www\\.)?example\\.com(/.*)?$",
  "^https?://github\\.com/example(/.*)?$",
  "^https?://localhost(:[0-9]+)?(/.*)?$",
  "^http://localhost(:[0-9]+)?(/.*)?$",
  "^https?://127\\.0\\.0\\.1(:[0-9]+)?(/.*)?$",
  "^http://127\\.0\\.0\\.1(:[0-9]+)?(/.*)?$",
  "^https://github\\.com/David-A18/MY-humble-knowledge-for-everyone/actions/runs/[0-9]+.*$",
  # Crossplane docs are valid official references, but GitHub-hosted lychee
  # runners intermittently fail to connect to this Netlify-backed domain.
  "^https://docs\\.crossplane\\.io(/.*)?$",
]

# Check public sources without overwhelming a single host. GitHub served
# intermittent 503/504 responses to valid links on three consecutive CI
# attempts; pace that host while keeping real broken links as failures.
max_concurrency = 16
max_retries = 6
retry_wait_time = 3

# Check the raw files behind three GitHub blob links that repeatedly returned
# 503 to Actions runners. The published Markdown keeps its readable GitHub
# links, while a missing source file still fails the external-link check.
remap = [
  '^https://github\.com/GoogleCloudPlatform/open-knowledge-format/blob/main/SPEC\.md$ https://raw.githubusercontent.com/GoogleCloudPlatform/open-knowledge-format/main/SPEC.md',
  '^https://github\.com/open-gitops/documents/blob/main/GLOSSARY\.md$ https://raw.githubusercontent.com/open-gitops/documents/main/GLOSSARY.md',
  '^https://github\.com/crossplane-contrib/provider-upjet-aws/blob/main/AUTHENTICATION\.md$ https://raw.githubusercontent.com/crossplane-contrib/provider-upjet-aws/main/AUTHENTICATION.md',
]

[hosts."github.com"]
concurrency = 2
request_interval = "300ms"
