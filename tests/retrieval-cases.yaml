version: "1"
cases:
  - id: git-undo-unstaged-edit
    question: How do I discard an unstaged edit without rewriting shared history?
    expected_paths: [knowledge/git/troubleshooting/undo-and-recovery.md]
    required_source_ids: [git-restore]
  - id: git-edit-stage-commit-push
    question: As a beginner, what happens to my change between editing a file, staging it, committing it, and pushing it in Git?
    expected_paths: [knowledge/git/git-fundamentals.md]
    required_source_ids: [pro-git-reset-demystified]
  - id: cdn-cache-key-personalized-leak
    question: Why can a CDN serve one logged-in user's page to a different user, and what part of the cache configuration causes it?
    expected_paths: [knowledge/cloud/edge/cdn-and-edge-fundamentals.md, knowledge/cloud/edge/cdn-caching-and-origin-protection.md]
    required_source_ids: [cloudfront-cache-key]
  - id: oidc-signin-versus-workload-federation
    question: Is GitHub Actions federation to AWS the same thing as OpenID Connect user sign-in, and which claim restricts which workflow can assume a role?
    expected_paths: [knowledge/security/identity-federation/oidc-fundamentals.md]
    required_source_ids: [openid-connect-core, github-actions-oidc-aws]
  - id: green-pipeline-is-not-working-deployment
    question: If CI passed and the Kubernetes rollout completed, does that prove the deployment works for users?
    expected_paths: [knowledge/cross-topic-guides/end-to-end-deployment.md, knowledge/cross-topic-guides/github-actions-with-kubernetes.md]
    required_source_ids: [kubernetes-deployments]
  - id: terraform-saved-plan-artifact-sensitivity
    question: Is it safe to store a saved Terraform plan file as a CI artifact, and why must apply in CI sit behind an approval gate?
    expected_paths: [knowledge/cross-topic-guides/github-actions-with-terraform.md]
    required_source_ids: [terraform-plan, terraform-apply]
  - id: terraform-s3-backend-locking-default
    question: Does the Terraform S3 backend lock state by default, and is DynamoDB locking still the recommended approach?
    expected_paths: [knowledge/cross-topic-guides/terraform-on-aws.md]
    required_source_ids: [terraform-s3-backend]
  - id: gitops-prune-and-self-heal-defaults
    question: If I delete a manifest from Git or edit a resource by hand, will Argo CD or Flux delete or revert it by default?
    expected_paths: [knowledge/kubernetes/applications-and-tools/gitops.md, knowledge/kubernetes/applications-and-tools/argo-cd-vs-flux.md]
    required_source_ids: [argo-cd-automated-sync, flux-kustomization]
  - id: local-kubernetes-learning
    question: What local Kubernetes route can I complete without an AWS account?
    expected_paths: [knowledge/cross-topic-guides/local-deployment-learning-path.md, knowledge/kubernetes/fundamentals/kubernetes-fundamentals.md]
    required_source_ids: [kubernetes-concepts]
  - id: kubernetes-service-ready-endpoints
    question: How does a Kubernetes Service choose Pods, and why might a matching Pod not receive normal traffic?
    expected_paths: [knowledge/kubernetes/core-objects/how-a-service-selects-pods.md]
    required_source_ids: [kubernetes-service, kubernetes-endpointslices]
  - id: terraform-local-state
    question: How can I practice Terraform state safely without creating cloud resources?
    expected_paths: [knowledge/terraform/examples/local-state-lifecycle/local-state-lifecycle.md]
    required_source_ids: [terraform-data, terraform-state]
  - id: terraform-values-through-configuration
    question: How do a Terraform input variable and local value reach a resource and then a root output?
    expected_paths: [knowledge/terraform/language/how-values-move-through-terraform.md]
    required_source_ids: [terraform-variables, terraform-outputs]
  - id: crossplane-provider-authentication
    question: How do Crossplane providers authenticate to external APIs?
    expected_paths: [knowledge/kubernetes/crossplane/providers-and-authentication.md]
    required_source_ids: [crossplane-providers]
  - id: eks-deployment
    question: How do I update kubeconfig and validate permissions before deploying to EKS?
    expected_paths: [knowledge/cross-topic-guides/deploying-to-eks.md]
    required_source_ids: [eks-update-kubeconfig]
  - id: kafka-duplicate-effects
    question: When can at-least-once Kafka processing cause duplicate side effects?
    expected_paths: [knowledge/databases/kafka/delivery-guarantees-and-failure-handling.md]
    required_source_ids: [kafka-design]
  - id: velero-restore
    question: How do I create and inspect a Velero restore?
    expected_paths: [knowledge/migrations/velero/backup-restore-workflows.md]
    required_source_ids: [velero-restore-reference]
  - id: crossplane-components
    question: What are Crossplane providers, managed resources, XRDs, compositions, and XRs?
    expected_paths: [knowledge/kubernetes/crossplane/component-model.md]
  - id: velero-cluster-migration
    question: How should I plan a Velero-based cluster migration or disaster recovery restore?
    expected_paths: [knowledge/migrations/velero/cluster-migration-and-disaster-recovery.md]
    required_source_ids: [velero-migration]
  - id: next-learning-route
    question: What should I learn after completing the local beginner route?
    expected_paths: [knowledge/start-here.md]
  - id: kubectl-safe-inspection
    question: How do I confirm my Kubernetes context and inspect Pods, logs, and events safely?
    expected_paths: [knowledge/kubernetes/commands/kubectl-basics.md]
    required_source_ids: [kubectl-reference]
  - id: cloud-cost-allocation
    question: How do I establish cloud cost ownership and a shared-cost allocation policy?
    expected_paths: [knowledge/finops/cost-allocation-basics.md]
    required_source_ids: [finops-allocation]
  - id: relational-or-document-order-model
    question: Should I store an order and its line items in relational tables or one document, and how do transactions and product queries affect the choice?
    expected_paths: [knowledge/databases/relational-vs-document-databases.md]
    required_source_ids: [postgresql-transactions, mongodb-atomicity, mongodb-multikey-embedded]
  - id: gateway-route-attachment-vs-backend-reference
    question: Why can an HTTPRoute fail to attach to a Gateway in another namespace, or attach but fail to use a Service in another namespace?
    expected_paths: [knowledge/kubernetes/applications-and-tools/gateway-api-and-ingress.md]
    required_source_ids: [gateway-api-overview, gateway-api-referencegrant]
  - id: finops-shared-cost-decision-coverage
    question: If a shared cloud bill is centrally funded, does it count as direct cost allocation, and how should I measure unresolved shared cost?
    expected_paths: [knowledge/finops/cost-allocation-basics.md]
    required_source_ids: [finops-allocation, finops-cost-allocation-guide]
  - id: retrieval-candidates-versus-reranking
    question: Can a reranker find a relevant knowledge page that the first search never returned, and how should I diagnose that miss?
    expected_paths: [knowledge/ai/ai-tooling/knowledge-bases/retrieval-and-context-efficiency.md]
    required_source_ids: [sqlite-fts5]
  - id: hostile-page-private-note-boundary
    question: If a retrieved public page tells an AI assistant to reveal a private note, what stops the assistant from fetching or exposing it?
    expected_paths: [knowledge/ai/ai-tooling/knowledge-bases/security-and-governance.md]
    required_source_ids: [owasp-prompt-injection, azure-document-access]
  - id: website-source-versus-derived-search
    question: Does Pagefind search come directly from the knowledge Git files, and which repository owns corrections to article text?
    expected_paths: [knowledge/ai/ai-tooling/knowledge-bases/reference-architecture.md]
    required_source_ids: [pagefind-docs, okf-spec]
