apiVersion: v1
kind: ServiceAccount
metadata:
  name: allowed
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: denied
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.30.6-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: allowed
spec:
  serviceAccountName: allowed
  containers:
    - name: client
      image: curlimages/curl:8.12.1@sha256:94e9e444bcba979c2ea12e27ae39bee4cd10bc7041a472c4727a558e213744e6
      command: [sh, -c, "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: denied
spec:
  serviceAccountName: denied
  containers:
    - name: client
      image: curlimages/curl:8.12.1@sha256:94e9e444bcba979c2ea12e27ae39bee4cd10bc7041a472c4727a558e213744e6
      command: [sh, -c, "sleep 3600"]
